<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NMA 아티스트 목록 관리</title><link rel="stylesheet" href="catalog-editor.css"></head>
<body>
<h1>NMA <span>ARTIST MANAGER</span></h1>
<p>운영자용 그룹 · 아티스트 · 멤버 목록 편집</p>
<p class="note">사진 없이 이름만 등록할 수 있어요. 기존 항목의 <b>수정</b>을 눌러 나중에 사진을 넣으세요.<br>편집 후 <b>목록 파일 저장</b> → 프로젝트의 <b>dist/artists.json</b> 교체 → GitHub에 업로드하면 반영됩니다.<br>이 화면의 수정은 저장한 파일에만 적용되며 공개 사이트에 즉시 반영되지 않습니다.</p>

<div class="tools">
  <button id="connect-file" type="button">
    📁 프로젝트 JSON 연결
  </button>

  <button id="download" type="button">
    ↓ 목록 파일 저장 (백업)
  </button>

  <button class="secondary" id="import-button" type="button">
    기존 목록 불러오기
  </button>

  <input hidden id="import" type="file"
    accept="application/json,.json">
</div>

<p id="status" role="status"></p>
<div id="layout">
<form id="form">
<h2 id="form-title">아티스트 등록</h2>
<label for="name">표시할 이름 *</label><input id="name" required maxlength="100" placeholder="예: 카리나">
<label for="english">영문 이름</label><input id="english" maxlength="100" placeholder="예: KARINA">
<label for="kind">분류</label><select id="kind"><option value="group">그룹</option><option value="member">멤버</option><option value="solo">솔로 아티스트</option></select>
<label for="group">소속 그룹 (멤버일 경우)</label><input id="group" maxlength="100" placeholder="예: 에스파">
<label for="aliases">다른 검색 이름 (쉼표로 구분)</label><input id="aliases" maxlength="1000" placeholder="예: 유지민, Yu Jimin, aespa Karina">
<label for="description">간단한 설명</label><input id="description" maxlength="200">
<label for="photo">사진 선택 (나중에 추가 가능)</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><img id="photo-preview" alt="선택한 사진 미리보기" hidden><button type="button" id="clear-photo" class="secondary">사진 비우기</button>
<label for="source">사진 출처 주소 (선택)</label><input id="source" type="url" placeholder="https://...">
<p>사진은 최대 480px로 줄여 목록 파일에 포함됩니다. 정사각형으로 표시되므로 얼굴이 중앙에 있는 사진을 권장합니다.</p>
<button id="submit">목록에 추가</button><button type="button" id="cancel" class="secondary" hidden>수정 취소</button>
</form>
<section><h2>등록 목록 <span id="count">0</span></h2><input id="filter" aria-label="등록 목록 검색" placeholder="한글 · 영문 · 그룹명으로 검색"><div id="cards"></div><button id="more" hidden>더 보기</button></section>
</div>
<script src="catalog-seed.js"></script><script src="catalog-editor.js"></script>
</body></html>
