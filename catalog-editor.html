<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NMA 아티스트 목록 관리</title><style>
:root{font-family:system-ui,sans-serif;color:#f7f5ef;background:#101010;color-scheme:dark}*{box-sizing:border-box}body{margin:0 auto;max-width:1000px;padding:30px 20px}h1{font-size:34px;letter-spacing:-1.5px}h1 span{color:#ff73b9}p{color:#aaa;font-size:13px;line-height:1.9}button,.file-btn{background:#e9ff63;border:0;color:#111;font-weight:700;padding:13px 18px;cursor:pointer;border-radius:3px;font-size:13px;display:inline-block}button.secondary,.file-btn{background:#242424;color:#eee;border:1px solid #555}input{display:block;width:100%;padding:13px;margin:7px 0 18px;background:#111;border:1px solid #555;color:white;border-radius:3px;font:inherit}label{font-size:13px}form{padding:24px;border:1px solid #444;background:#191919}#layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}#photo-preview{width:130px;height:130px;object-fit:cover;background:#292929;border:1px dashed #666;margin-bottom:20px}#cards{display:grid;gap:12px;align-content:start}.card{padding:13px;border:1px solid #444;display:flex;gap:14px;align-items:center}.card img{width:62px;height:62px;object-fit:cover}.card strong{display:block;font-size:14px}.card small{color:#999}.card button{padding:9px;background:#292929;color:#eee;margin:8px 5px 0 0}.tools{display:flex;gap:10px;flex-wrap:wrap}.note{padding:15px;border-left:3px solid #ff73b9;background:#191919}#status{min-height:24px;color:#e9ff63;font-size:13px}#cancel{margin-left:8px}.hidden{display:none}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #ff73b9;outline-offset:3px}@media(max-width:650px){#layout{grid-template-columns:1fr}body{padding:20px 16px}h1{font-size:29px}}
</style><h1>NMA <span>ARTIST MANAGER</span></h1><p>운영자용 아티스트 목록 제작 도구</p><p class="note">① 이름과 사진 등록 → ② <b>목록 파일 저장</b> → ③ 저장한 <b>artists.json</b>을 Codex 채팅에 첨부해 사이트 반영 요청<br>여기에서 등록한 목록은 공개 사이트에 즉시 반영되지 않습니다. 이전에 저장한 파일을 불러오면 이어서 수정할 수 있습니다.</p><div class="tools"><button id="download">↓ 목록 파일 저장</button><button class="secondary" id="import-button">기존 목록 불러오기</button><input class="hidden" id="import" type="file" accept="application/json,.json"></div><p id="status" role="status">등록된 아티스트 0명</p><div id="layout"><form id="form"><h2 id="form-title">아티스트 등록</h2><label for="name">아티스트 이름 *</label><input id="name" required maxlength="100" placeholder="예: 에스파"><label for="aliases">다른 검색 이름 (쉼표로 구분)</label><input id="aliases" maxlength="300" placeholder="예: aespa, Aespa"><label for="description">간단한 설명</label><input id="description" maxlength="200" placeholder="예: 4인조 걸그룹"><label for="photo">사진 선택 *</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><img id="photo-preview" alt="선택한 사진 미리보기" hidden><label for="source">사진 출처 주소 (선택)</label><input id="source" type="url" placeholder="https://..."><p>사진은 최대 480px로 줄여 목록 파일에 포함됩니다. 정사각형으로 잘라 표시되므로 얼굴이 중앙에 있는 사진을 권장합니다.</p><button id="submit">목록에 추가</button><button type="button" id="cancel" class="secondary" hidden>수정 취소</button></form><section><h2>등록 목록 <span id="count">0</span></h2><input id="filter" aria-label="등록 목록 검색" placeholder="등록한 아티스트 찾기"><div id="cards"></div></section></div><script>
const $=s=>document.querySelector(s);let artists=[],editing=null,photo='',dirty=false,photoLoading=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(s){$('#status').textContent=s}function reset(){editing=null;photo='';$('#form').reset();$('#photo-preview').hidden=true;$('#submit').textContent='목록에 추가';$('#form-title').textContent='아티스트 등록';$('#cancel').hidden=true}
function render(){const q=$('#filter').value.toLowerCase().replace(/\s/g,'');$('#count').textContent=artists.length;$('#cards').innerHTML=artists.filter(a=>[a.name,...a.aliases].some(n=>n.toLowerCase().replace(/\s/g,'').includes(q))).map(a=>`<article class="card"><img src="${esc(a.image)}" alt="${esc(a.name)}"><div><strong>${esc(a.name)}</strong><small>${esc(a.aliases.join(', '))}</small><div><button data-edit="${esc(a.id)}">수정</button><button data-remove="${esc(a.id)}">삭제</button></div></div></article>`).join('')||'<p>아티스트를 등록하면 여기에 표시됩니다.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const a=artists.find(a=>a.id===b.dataset.edit);editing=a.id;photo=a.image;$('#name').value=a.name;$('#aliases').value=a.aliases.join(', ');$('#description').value=a.description||'';$('#source').value=a.source||'';$('#photo-preview').src=photo;$('#photo-preview').hidden=false;$('#photo').value='';$('#form-title').textContent='아티스트 수정';$('#submit').textContent='수정 저장';$('#cancel').hidden=false;$('#name').focus()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const a=artists.find(a=>a.id===b.dataset.remove);if(!confirm(a.name+'을 목록에서 삭제할까요?'))return;artists=artists.filter(a=>a.id!==b.dataset.remove);if(editing===b.dataset.remove)reset();dirty=true;render();status('목록에서 삭제했습니다. 목록 파일을 다시 저장해주세요.')})}
$('#filter').oninput=render;$('#cancel').onclick=reset;
$('#photo').onchange=async()=>{const f=$('#photo').files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>20*1024*1024){status('20MB 이하 JPG, PNG, WebP 사진을 선택해주세요.');$('#photo').value='';return}photoLoading=true;$('#submit').disabled=true;const url=URL.createObjectURL(f);try{const image=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=url});const scale=Math.min(1,480/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);photo=canvas.toDataURL('image/jpeg',.82);$('#photo-preview').src=photo;$('#photo-preview').hidden=false;status('사진 준비 완료. 이름을 입력하고 목록에 추가해주세요.')}catch{status('사진을 읽지 못했습니다. 다른 사진을 선택해주세요.')}finally{photoLoading=false;$('#submit').disabled=false;URL.revokeObjectURL(url)}};
$('#form').onsubmit=e=>{e.preventDefault();if(photoLoading)return;if(!photo){status('사진을 선택해주세요.');return}const name=$('#name').value.trim();if(!name)return;const source=$('#source').value.trim();if(source&&!/^https?:\/\//.test(source)){status('출처는 https:// 또는 http:// 주소로 입력해주세요.');return}if(artists.some(a=>a.id!==editing&&a.name.toLowerCase()===name.toLowerCase())){status('같은 이름이 이미 등록돼 있어요. 기존 아티스트를 수정해주세요.');return}const a={id:editing||crypto.randomUUID(),name,aliases:$('#aliases').value.split(',').map(s=>s.trim()).filter(Boolean),description:$('#description').value.trim(),image:photo,source};if(editing)artists[artists.findIndex(a=>a.id===editing)]=a;else artists.push(a);dirty=true;reset();render();status(`등록된 아티스트 ${artists.length}명 · 목록 파일을 저장해주세요.`)};
$('#download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,artists},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='artists.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);dirty=false;status(`${artists.length}명 목록 파일을 다운로드했습니다. Codex 채팅에 첨부하면 공개 사이트에 반영할 수 있어요.`)};
$('#import-button').onclick=()=>$('#import').click();$('#import').onchange=async()=>{const file=$('#import').files[0];if(!file)return;if(dirty&&!confirm('아직 저장하지 않은 변경사항이 있습니다. 불러온 목록으로 교체할까요?'))return;try{const data=JSON.parse(await file.text()),ids=new Set();if(data.version!==1||!Array.isArray(data.artists))throw Error();const next=data.artists.map(a=>{if(typeof a.id!=='string'||ids.has(a.id)||typeof a.name!=='string'||!a.name.trim()||typeof a.image!=='string'||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(a.image)||a.image.length>600000)throw Error();ids.add(a.id);return{...a,aliases:Array.isArray(a.aliases)?a.aliases.filter(x=>typeof x==='string'):[]}});artists=next;dirty=false;reset();render();status(`${artists.length}명의 아티스트를 불러왔어요.`)}catch{status('올바른 artists.json 파일을 선택해주세요. 기존 목록은 유지됩니다.')}finally{$('#import').value=''}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});render();
</script></html>
